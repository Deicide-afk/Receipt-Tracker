<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger &mdash; Receipt Sales Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper: #FAF6EF;
    --card: #FFFFFF;
    --ink: #241A16;
    --ink-soft: #6B5A50;
    --ink-faint: #9A8B80;
    --burgundy: #7A2333;
    --burgundy-dark: #591826;
    --burgundy-tint: #F5E6E9;
    --gold: #B8863B;
    --gold-tint: #F7EDDA;
    --sage: #52735A;
    --sage-tint: #E7EFE6;
    --line: #E5DACB;
    --line-soft: #EFE7DA;
    --shadow: rgba(36,26,22,0.07);
    --radius-card: 14px;
    --radius-pill: 999px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    margin: 0 0 4px 0;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .mono{ font-family: 'IBM Plex Mono', monospace; }
  a{ color: inherit; }
  button{ font-family: inherit; cursor: pointer; }
  input, select, textarea{ font-family: inherit; font-size: 14px; }
  :focus-visible{ outline: 2px solid var(--burgundy); outline-offset: 2px; }

  /* ---------- Shell ---------- */
  #shell{
    display:flex;
    min-height:100vh;
  }
  #sidebar{
    width: 236px;
    flex-shrink:0;
    background: var(--ink);
    color: #EFE4DC;
    padding: 28px 20px;
    display:flex;
    flex-direction:column;
    position: sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom: 6px;
  }
  .brand-mark{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 21px;
    color: #fff;
  }
  .brand-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: #C9A24A;
    letter-spacing: 0.04em;
  }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #8C7E74;
    margin-bottom: 26px;
    padding-bottom: 22px;
    border-bottom: 1px dashed #4A3D36;
  }
  nav.mainnav{
    display:flex;
    flex-direction:column;
    gap: 2px;
  }
  nav.mainnav button{
    all: unset;
    display:flex;
    align-items:center;
    gap:10px;
    padding: 10px 12px;
    border-radius: 8px;
    color: #D8CBC1;
    font-size: 14px;
    font-weight: 500;
    transition: background .15s ease, color .15s ease;
  }
  nav.mainnav button:hover{ background: rgba(255,255,255,0.06); color:#fff; }
  nav.mainnav button.active{ background: var(--burgundy); color:#fff; }
  nav.mainnav .navdot{
    width:6px; height:6px; border-radius:50%;
    background: currentColor; opacity:.5; flex-shrink:0;
  }
  nav.mainnav button.active .navdot{ opacity:1; background:#F0C879; }
  #sidebar-foot{
    margin-top:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: #7A6C62;
    line-height:1.6;
    padding-top:16px;
    border-top: 1px dashed #4A3D36;
  }

  #main{
    flex:1;
    padding: 40px 48px 80px;
    max-width: 1180px;
  }
  .view-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .view-head p{ color: var(--ink-soft); margin:6px 0 0; max-width: 520px; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 10px 18px;
    border-radius: var(--radius-pill);
    border: 1px solid transparent;
    background: var(--burgundy);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:hover{ background: var(--burgundy-dark); }
  .btn:active{ transform: scale(0.98); }
  .btn.secondary{
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn.secondary:hover{ background: var(--line-soft); }
  .btn.ghost{
    background: transparent;
    color: var(--burgundy);
    padding: 8px 10px;
    font-weight: 600;
  }
  .btn.ghost:hover{ background: var(--burgundy-tint); }
  .btn.danger{ color: #A23B3B; }
  .btn.danger:hover{ background: #F7E9E9; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.small{ padding: 6px 12px; font-size: 13px; }

  /* ---------- Cards ---------- */
  .card{
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-card);
    box-shadow: 0 1px 2px var(--shadow);
    padding: 24px;
  }
  .card + .card{ margin-top: 20px; }

  /* Dashboard hero */
  .hero-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .combo-card{
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-card);
    padding: 26px 26px 22px;
    position: relative;
    overflow:hidden;
  }
  .combo-card::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height: 6px;
    background-image: repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 20px);
  }
  .combo-card .label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: none;
    display:flex; align-items:center; gap:8px;
  }
  .combo-card .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .combo-card .amount{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 42px;
    margin-top: 8px;
    letter-spacing: -0.01em;
  }
  .combo-card.ct .swatch{ background: var(--gold); }
  .combo-card.cp .swatch{ background: var(--sage); }
  .stat-row{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat-mini{
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .stat-mini .label{ font-size:12.5px; color:var(--ink-soft); }
  .stat-mini .value{ font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; margin-top:4px; }

  /* ---------- Tables ---------- */
  table{ width:100%; border-collapse: collapse; }
  th{
    text-align:left;
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  td{
    padding: 10px 10px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 14px;
    vertical-align: middle;
  }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; font-family:'IBM Plex Mono', monospace; font-size:13.5px; }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    background: var(--line-soft);
    color: var(--ink-soft);
  }
  .tag.role-cake{ background: var(--burgundy-tint); color: var(--burgundy); }
  .tag.role-topper{ background: var(--gold-tint); color: var(--gold); }
  .tag.role-pastries{ background: var(--sage-tint); color: var(--sage); }
  .tag.unmatched{ background:#FBEAEA; color:#A23B3B; }

  /* ---------- Forms ---------- */
  label.field{ display:block; margin-bottom:14px; }
  label.field span{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  textarea{ resize: vertical; }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus{
    border-color: var(--burgundy);
  }
  .field-row{ display:grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 14px; }

  .empty{
    text-align:center;
    padding: 46px 20px;
    color: var(--ink-soft);
  }
  .empty h3{ color: var(--ink); margin-bottom:6px; }

  .banner{
    background: var(--gold-tint);
    border: 1px solid #E9D2A0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: #6B5121;
    margin-bottom: 22px;
    display:flex; gap:10px; align-items:flex-start;
  }
  .banner b{ font-weight:700; }

  .section-title{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin: 26px 0 10px;
  }
  .cat-block{ margin-bottom: 22px; }
  .cat-block-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 8px;
  }
  .divider{ height:1px; background: var(--line-soft); margin: 20px 0; border:none; }

  .modal-backdrop{
    position:fixed; inset:0; background: rgba(36,26,22,0.35);
    display:flex; align-items:center; justify-content:center;
    z-index: 50; padding: 20px;
  }
  .modal{
    background:#fff; border-radius: 16px; padding: 26px;
    max-width: 460px; width:100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top: 18px; }

  .pill-select{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .pill-select button{
    all:unset; padding:6px 14px; border-radius: var(--radius-pill);
    border:1px solid var(--line); font-size:13px; color:var(--ink-soft);
  }
  .pill-select button.active{ background: var(--ink); color:#fff; border-color:var(--ink); }

  .topbar-mobile{ display:none; }

  @media (max-width: 880px){
    #shell{ flex-direction:column; }
    #sidebar{ display:none; }
    .topbar-mobile{
      display:flex; overflow-x:auto; gap:4px;
      background: var(--ink); padding: 12px 14px; position:sticky; top:0; z-index:10;
    }
    .topbar-mobile button{
      all:unset; white-space:nowrap; padding:8px 14px; border-radius: var(--radius-pill);
      color:#D8CBC1; font-size:13px; font-weight:600;
    }
    .topbar-mobile button.active{ background: var(--burgundy); color:#fff; }
    #main{ padding: 24px 18px 60px; }
    .hero-row{ grid-template-columns: 1fr; }
    .stat-row{ grid-template-columns: 1fr 1fr; }
  }

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }
</style>
</head>
<body>

<div id="shell">
  <aside id="sidebar">
    <div class="brand"><span class="brand-mark">Ledger</span></div>
    <div class="brand-sub">RECEIPT SALES TRACKER</div>
    <nav class="mainnav" id="nav"></nav>
    <div id="sidebar-foot">
      Data lives in this<br>browser tab only.<br>Export before closing.
    </div>
  </aside>

  <div class="topbar-mobile" id="navMobile"></div>

  <main id="main"></main>
</div>

<div id="modalRoot"></div>

<script>
/* =========================================================
   STATE
   ========================================================= */
let state = {
  view: 'dashboard',
  categories: [
    { id: 'cat-cake', name: 'Cake', role: 'cake' },
    { id: 'cat-topper', name: 'Topper', role: 'topper' },
    { id: 'cat-pastries', name: 'Pastries', role: 'pastries' }
  ],
  products: buildDefaultProducts(),
  receipts: [],
  draft: null, // in-progress parsed receipt awaiting review
  historyFilter: 'combo' // 'combo' = only Cake+Topper / Cake+Pastries receipts, 'all' = every saved receipt
};

/* Seed product list, grouped by role. Only items in "cake", "topper" or
   "pastries" ever contribute to the two tracked combinations — anything
   else (bags, one-off freebies, etc.) is left out on purpose so it can
   never accidentally count. Add/edit/remove any of these later from the
   Products & Categories screen. */
function buildDefaultProducts(){
  const CAKE = [
    'MDC ROUND','CDC ROUND','SCHDC ROUND','CADC ROUND','CMDC ROUND','SUCDC ROUND',
    'CDC 8X12 2022','CDC 12X12 2022','CADC 8X12','CMDC 8X12','SCHDC 8X12','MDC8X12 2023',
    'BF PETITE','BF 2024 JR','UC PETITE 2026','UC JR 2026','TCC PETITE','TCC REG',
    'MDLC PETITE','MDLC REG','CBC REG','CBC PETITE','CBC JR.','CM REG',
    'MOCRL-F','MCRL-F','TCRL-F 2025','TCRL-H 2025','CRL-F','BDM-F(RL)',
    'MBC PETITE','MBC REG'
  ];
  const TOPPER = [
    'GOLD HB TOPPER','SILVER HB TOPPER','CANDLE RED STK',
    'CANDLE#1','CANDLE#2','CANDLE#3','CANDLE#4','CANDLE#5',
    'HBDAY CANDLE'
  ];
  const PASTRIES = [
    'BM','BM 5S','BM 9+1','ADD-ON BM 5S','UM','MM','MC-S','MC LF',
    'ENS 2021','ENS 4S 2021','ENS 8S 2021',
    'CHCS 2026','UMCS 2026','MMCS 2026','DDCS 2026','RVCS 2026','SCS 2026','CCS 2026','CPBCS 2026',
    'ASD CS 5S 2025','ASD CS 8S 2025','ASMON PACK 5S','AS PBD 5S 2021',
    'CHM 2019','UBENS','PVNAS 15S','PVNPE 8S','BUPT 10S',
    'TAISAN LOAF','TAISAN SLC','MH20','FB','BCR'
  ];
  let n = 0;
  const mk = (name, categoryId) => ({ id: 'p' + (++n), name, categoryId });
  return [
    ...CAKE.map(name => mk(name, 'cat-cake')),
    ...TOPPER.map(name => mk(name, 'cat-topper')),
    ...PASTRIES.map(name => mk(name, 'cat-pastries'))
  ];
}

const SAMPLE_RECEIPT = `RR7024
Sales INVOICE
SI# 01-00023911
Trans# 7024 0100024019
Cashier: 69027-RESHELL C

08/01/2026 09:03

--------TAKE-OUT--------
1 CDC 8X12 2022           @689         689.00V
1 GOLD HB TOPPER          @25           25.00V
1 CANDLE#7                @15           15.00V

3 Item(s)                          PHP 729.00
TOTAL DUE                   PHP 729.00
CASH                                1,000.00
CHANGE                      PHP 271.00

VATable Sales                         650.89
VAT Amount                             78.11`;

function uid(prefix){ return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* =========================================================
   HELPERS: money, normalize, matching, parsing, combos
   ========================================================= */
function peso(n){
  const v = Number(n) || 0;
  return '\u20B1' + v.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function toNum(s){
  if (typeof s === 'number') return s;
  return parseFloat(String(s).replace(/,/g,'')) || 0;
}
function normalize(s){
  return String(s).toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
function categoryById(id){ return state.categories.find(c => c.id === id) || null; }
function productById(id){ return state.products.find(p => p.id === id) || null; }
function roleLabel(role){
  return role === 'cake' ? 'Cake' : role === 'topper' ? 'Topper' : role === 'pastries' ? 'Pastries' : null;
}
function roleTagClass(role){
  return role === 'cake' ? 'role-cake' : role === 'topper' ? 'role-topper' : role === 'pastries' ? 'role-pastries' : '';
}

function matchProduct(rawName){
  const a = normalize(rawName);
  const aTokens = a.split(' ').filter(Boolean);
  let best = null, bestScore = 0;
  state.products.forEach(p => {
    const b = normalize(p.name);
    let score = 0;
    if (a === b) score = 1;
    else if (a.includes(b) || b.includes(a)) score = 0.9;
    else {
      const bTokens = b.split(' ').filter(Boolean);
      const setA = new Set(aTokens), setB = new Set(bTokens);
      const inter = [...setA].filter(x => setB.has(x)).length;
      const union = new Set([...setA, ...setB]).size;
      score = union ? inter / union : 0;
    }
    if (score > bestScore) { bestScore = score; best = p; }
  });
  return bestScore >= 0.5 ? { product: best, score: bestScore } : { product: null, score: bestScore };
}

const IGNORE_KEYWORDS = /(TOTAL|SUBTOTAL|CASH\b|CHANGE|VAT|ITEM\(S\)|ITEMS\b|^PHP|TIN:|SI#|TRANS#|CASHIER|INVOICE|MIN#|ACCREDITATION|PTU#|^-{2,}|^={2,}|THANK|VISIT|ORDER YOUR|NEED ASSISTANCE|SCAN THE|SHARE YOUR|WE LOVE|WALTERMART|BAKESHOP|BULACAN|CUST NAME|ADDRESS:|DATE ISSUED|^RR\d|ZERO-RATED|VAT-EXEMPT|VATABLE|CHRG INST|BOOKING ID|FOOD PANDA|GRAB FOOD|DEBIT CREDIT|^QR PH|REF NO|AUTH CODE|APPRCODE|CARD NO|LESS SC|LESS PWD|LESS EMP|LESS PROMO|APPROVED BY|TAKE-OUT|TAKE OUT|\bBOOKING\b)/i;

const ITEM_REGEX = /^(\d+)\s+(.+?)\s+@\s*([\d,]+\.?\d*)\s+([\d,]+\.?\d*)\s*V?$/i;
const FALLBACK_REGEX = /^(.+?)\s{2,}([\d,]+\.\d{2})\s*V?$/;

function parseReceiptText(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  let number = null, date = null, totalDue = null;
  const candidates = [];

  lines.forEach(line => {
    if (!number) {
      const m = line.match(/SI#\s*([^\s]+)/i);
      if (m) number = m[1];
    }
    if (!date) {
      const m = line.match(/(\d{2}\/\d{2}\/\d{4})/);
      if (m) date = m[1];
    }
    if (!totalDue) {
      const m = line.match(/TOTAL\s+DUE\s*(?:PHP)?\s*([\d,]+\.\d{2})/i);
      if (m) totalDue = toNum(m[1]);
    }
  });
  if (!number) {
    lines.forEach(line => {
      if (!number) {
        const m = line.match(/Trans#\s*([^\s]+)/i);
        if (m) number = m[1];
      }
    });
  }
  if (!number) number = 'R' + Date.now().toString(36).toUpperCase();

  lines.forEach(line => {
    const m1 = line.match(ITEM_REGEX);
    if (m1) {
      candidates.push({
        qty: toNum(m1[1]),
        rawName: m1[2].trim(),
        unitPrice: toNum(m1[3]),
        total: toNum(m1[4])
      });
      return;
    }
    if (IGNORE_KEYWORDS.test(line)) return;
    const m2 = line.match(FALLBACK_REGEX);
    if (m2) {
      const name = m2[1].trim();
      if (name.length < 2) return;
      const total = toNum(m2[2]);
      candidates.push({ qty: 1, rawName: name, unitPrice: total, total: total });
    }
  });

  const items = candidates.map(c => {
    const { product, score } = matchProduct(c.rawName);
    return {
      id: uid('it'),
      rawName: c.rawName,
      qty: c.qty,
      unitPrice: c.unitPrice,
      total: c.total,
      productId: product ? product.id : null,
      categoryId: product ? product.categoryId : null,
      matched: !!product,
      score: score
    };
  });

  return { number, date: date || '', totalDue: totalDue || 0, items, rawText: text };
}

/* Split a block of pasted text containing MANY receipts back-to-back into
   one chunk per receipt. We anchor on the "SI#" (Sales Invoice #) label,
   which appears exactly once near the top of every PH-style POS receipt.
   Trailing header noise (store name, POS/MIN numbers, etc.) that spills
   into the next chunk is harmless — parseReceiptText() already ignores it
   via IGNORE_KEYWORDS. If no "SI#" is found at all, the whole text is
   treated as a single receipt (old behavior for one-at-a-time pasting). */
function splitReceipts(text){
  const parts = text.split(/(?=SI#\s*[\w-]+)/i).map(s => s.trim()).filter(Boolean);
  return parts.length ? parts : [text.trim()].filter(Boolean);
}

/* Parse every receipt found in `text` and split the results into the ones
   that actually qualify for a tracked combo (Cake+Topper or Cake+Pastries)
   and the ones that don't (cake alone, pastries alone, unrecognized items,
   etc.). This is the "only capture Cake+Pastry / Cake+Topper" behavior. */
function bulkParseReceipts(text){
  const chunks = splitReceipts(text);
  const captured = [], skipped = [];
  chunks.forEach(chunk => {
    const parsed = parseReceiptText(chunk);
    if (!parsed.items.length && !parsed.totalDue) return; // pure noise chunk, drop silently
    const combos = computeCombosFromItems(parsed.items);
    if (combos.cakeTopper > 0 || combos.cakePastries > 0) {
      captured.push({ parsed, combos });
    } else {
      skipped.push({ parsed, combos });
    }
  });
  return { captured, skipped };
}

function computeCombosFromItems(items){
  let cake = 0, topper = 0, pastries = 0;
  items.forEach(it => {
    if (!it.categoryId) return;
    const cat = categoryById(it.categoryId);
    if (!cat) return;
    if (cat.role === 'cake') cake += toNum(it.total);
    else if (cat.role === 'topper') topper += toNum(it.total);
    else if (cat.role === 'pastries') pastries += toNum(it.total);
  });
  const cakeTopper = (cake > 0 && topper > 0) ? cake + topper : 0;
  const cakePastries = (cake > 0 && pastries > 0) ? cake + pastries : 0;
  return { cake, topper, pastries, cakeTopper, cakePastries };
}

function allCombosTotal(){
  let cakeTopper = 0, cakePastries = 0;
  state.receipts.forEach(r => {
    const c = computeCombosFromItems(r.items);
    cakeTopper += c.cakeTopper;
    cakePastries += c.cakePastries;
  });
  return { cakeTopper, cakePastries };
}

   RENDER SHELL / NAV
   ========================================================= */
const NAV_ITEMS = [
  { id: 'dashboard', label: 'Dashboard' },
  { id: 'add', label: 'Add Receipt' },
  { id: 'history', label: 'Receipt History' },
  { id: 'products', label: 'Products & Categories' },
  { id: 'export', label: 'Export' }
];

function renderNav(){
  const build = (container, mobile) => {
    container.innerHTML = '';
    NAV_ITEMS.forEach(item => {
      const b = document.createElement('button');
      b.textContent = item.label;
      if (!mobile) {
        const dot = document.createElement('span');
        dot.className = 'navdot';
        b.prepend(dot);
      }
      if (state.view === item.id) b.classList.add('active');
      b.addEventListener('click', () => { state.view = item.id; state.draft = state.draft && item.id === 'add' ? state.draft : (item.id === 'add' ? state.draft : state.draft); render(); });
      container.appendChild(b);
    });
  };
  build(document.getElementById('nav'), false);
  build(document.getElementById('navMobile'), true);
}

function render(){
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if (state.view === 'dashboard') renderDashboard(main);
  else if (state.view === 'add') renderAddReceipt(main);
  else if (state.view === 'history') renderHistory(main);
  else if (state.view === 'products') renderProducts(main);
  else if (state.view === 'export') renderExport(main);
}

function renderAddReceipt(main){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="view-head">
      <div>
        <h1>Add Receipt</h1>
        <p>Paste the raw receipt text below. We'll pull out only the products you've configured, and let you review everything before it's saved.</p>
      </div>
    </div>
    <div class="card">
      <label class="field"><span>Raw receipt text</span>
        <textarea id="rawInput" rows="12" placeholder="Paste one receipt, or paste a whole day's worth of receipts back-to-back &mdash; Bulk Import will split them automatically.">${state.draft ? state.draft.rawText : ''}</textarea>
      </label>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn" id="parseBtn">Parse Receipt</button>
        <button class="btn" id="bulkBtn" style="background:var(--sage);">Bulk Import (Cake+Topper / Cake+Pastries only)</button>

        ${state.draft ? '<button class="btn secondary" id="clearBtn">Clear</button>' : ''}
      </div>
      <p style="color:var(--ink-soft); font-size:13px; margin:10px 0 0;">Bulk Import splits pasted text into individual receipts, then saves <b>only</b> the ones that contain both a Cake item and a Topper, or both a Cake item and a Pastries item. Everything else is skipped automatically.</p>
    </div>
    <div id="bulkResultArea"></div>
    <div id="reviewArea"></div>
  `;
  main.appendChild(wrap);

  document.getElementById('sampleBtn').addEventListener('click', () => {
    document.getElementById('rawInput').value = SAMPLE_RECEIPT;
  });
  document.getElementById('clearBtn')?.addEventListener('click', () => {
    state.draft = null; render();
  });
  document.getElementById('parseBtn').addEventListener('click', () => {
    const text = document.getElementById('rawInput').value;
    if (!text.trim()) return;
    const parsed = parseReceiptText(text);
    state.draft = parsed;
    render();
  });
  document.getElementById('bulkBtn').addEventListener('click', () => {
    const text = document.getElementById('rawInput').value;
    if (!text.trim()) return;
    const { captured, skipped } = bulkParseReceipts(text);
    captured.forEach(({ parsed }) => {
      state.receipts.push({
        id: uid('rcpt'),
        number: parsed.number,
        date: parsed.date,
        totalDue: parsed.totalDue,
        rawText: parsed.rawText,

function renderBulkResult(container, captured, skipped){
  const cakeTopperCount = captured.filter(c => c.combos.cakeTopper > 0).length;
  const cakePastriesCount = captured.filter(c => c.combos.cakePastries > 0).length;
  container.innerHTML = `
    <div class="card">
      <h4 style="margin-bottom:10px;">Bulk import result</h4>
      <div class="stat-row">
        <div class="stat-mini"><div class="label">Receipts captured</div><div class="value">${captured.length}</div></div>
        <div class="stat-mini"><div class="label">&mdash; with Cake+Topper</div><div class="value">${cakeTopperCount}</div></div>
        <div class="stat-mini"><div class="label">&mdash; with Cake+Pastries</div><div class="value">${cakePastriesCount}</div></div>
      </div>
      <p style="color:var(--ink-soft); font-size:13.5px;">${skipped.length} receipt(s) were skipped &mdash; no Cake+Topper or Cake+Pastries combination found on them (e.g. pastries only, cake only, or unrecognized items).</p>
      ${captured.length ? '<button class="btn" id="goHistoryFromBulk">View in Receipt History</button>' : ''}
    </div>
  `;
  document.getElementById('goHistoryFromBulk')?.addEventListener('click', () => {
    state.view = 'history';
    render();
  });
}

function renderReview(container, draft){
  const matched = draft.items.filter(i => i.categoryId);
  const unmatched = draft.items.filter(i => !i.categoryId);
  const combos = computeCombosFromItems(draft.items);

  container.innerHTML = `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h4 style="margin:0;">Review extracted items \u2014 Receipt #${draft.number}</h4>
        <span class="mono" style="font-size:13px; color:var(--ink-soft);">${draft.date || 'no date found'} \u00b7 Total on receipt: ${peso(draft.totalDue)}</span>
      </div>

      ${unmatched.length ? `<div class="banner"><span>&#9888;</span><span><b>${unmatched.length} item(s) could not be confidently matched.</b> Assign them to a product below, or leave unassigned to exclude from totals.</span></div>` : ''}

      <table style="margin-top:6px;">
        <thead><tr><th>Extracted text</th><th>Product / assignment</th><th>Category</th><th class="num">Qty</th><th class="num">Unit Price</th><th class="num">Total</th><th></th></tr></thead>
        <tbody id="reviewRows"></tbody>
      </table>
      <button class="btn ghost small" id="addManualRow" style="margin-top:8px;">+ Add item manually</button>

      <hr class="divider">
      <div class="field-row" style="max-width:420px;">
        <div><div class="stat-mini"><div class="label">Cake + Topper (this receipt)</div><div class="value">${peso(combos.cakeTopper)}</div></div></div>
        <div><div class="stat-mini"><div class="label">Cake + Pastries (this receipt)</div><div class="value">${peso(combos.cakePastries)}</div></div></div>
      </div>

      <div style="margin-top:20px; display:flex; gap:10px;">
        <button class="btn" id="saveReceipt">Save Receipt</button>
        <button class="btn secondary" id="discardReceipt">Discard</button>
      </div>
    </div>
  `;

  const rowsBody = container.querySelector('#reviewRows');
  function drawRows(){
    rowsBody.innerHTML = '';
    draft.items.forEach((it, idx) => rowsBody.appendChild(buildReviewRow(it, idx)));
  }
  function buildReviewRow(it, idx){
    const tr = document.createElement('tr');
    const cat = it.categoryId ? categoryById(it.categoryId) : null;
    const productOptions = state.products.map(p => `<option value="${p.id}" ${p.id === it.productId ? 'selected' : ''}>${p.name}</option>`).join('');
    tr.innerHTML = `
      <td>${it.rawName}</td>
      <td>
        <select data-role="product" style="min-width:170px;">
          <option value="">\u2014 unassigned \u2014</option>
          ${productOptions}
        </select>
      </td>
      <td>${cat ? `<span class="tag ${roleTagClass(cat.role)}">${cat.name}</span>` : `<span class="tag unmatched">unassigned</span>`}</td>
      <td class="num"><input type="number" min="0" step="1" value="${it.qty}" data-role="qty" style="width:56px; text-align:right;"></td>
      <td class="num"><input type="number" min="0" step="0.01" value="${it.unitPrice}" data-role="unitPrice" style="width:80px; text-align:right;"></td>
      <td class="num"><input type="number" min="0" step="0.01" value="${it.total}" data-role="total" style="width:88px; text-align:right;"></td>
      <td><button class="btn ghost small" data-role="remove">Remove</button></td>
    `;
    tr.querySelector('[data-role=product]').addEventListener('change', e => {
      const p = productById(e.target.value);
      it.productId = p ? p.id : null;
      it.categoryId = p ? p.categoryId : null;
      draft.items[idx] = it;
      renderReview(container, draft);
    });
    tr.querySelector('[data-role=qty]').addEventListener('input', e => { it.qty = toNum(e.target.value); });
    tr.querySelector('[data-role=unitPrice]').addEventListener('input', e => { it.unitPrice = toNum(e.target.value); });
    tr.querySelector('[data-role=total]').addEventListener('input', e => {
      it.total = toNum(e.target.value);
      const combosNow = computeCombosFromItems(draft.items);
      container.querySelectorAll('.stat-mini .value')[0].textContent = peso(combosNow.cakeTopper);
      container.querySelectorAll('.stat-mini .value')[1].textContent = peso(combosNow.cakePastries);
    });
    tr.querySelector('[data-role=remove]').addEventListener('click', () => {
      draft.items.splice(idx, 1);
      renderReview(container, draft);
    });
    return tr;
  }
  drawRows();

  container.querySelector('#addManualRow').addEventListener('click', () => {
    draft.items.push({ id: uid('it'), rawName: '(manual entry)', qty: 1, unitPrice: 0, total: 0, productId: null, categoryId: null, matched: false, score: 0 });
    renderReview(container, draft);
  });

  container.querySelector('#saveReceipt').addEventListener('click', () => {
    const receipt = {
      id: uid('rcpt'),
      number: draft.number,
      date: draft.date,
      totalDue: draft.totalDue,
      rawText: draft.rawText,
      items: draft.items.map(i => ({ ...i }))
    };
    state.receipts.push(receipt);
    state.draft = null;
    state.view = 'history';
    render();
  });
  container.querySelector('#discardReceipt').addEventListener('click', () => {
    state.draft = null;
    render();
  });
}

function renderHistory(main){

  wrap.innerHTML = `
    <div class="view-head">
      <div>
        <h1>Receipt History</h1>
        <p>Every saved receipt, with its combination totals recalculated live from current categories.</p>
      </div>
      <button class="btn" id="goAdd2">+ Add Receipt</button>
    </div>
    <div class="card" style="padding:14px 24px; margin-bottom:0;">
      <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft); cursor:pointer;">
        <input type="checkbox" id="comboOnlyToggle" ${state.historyFilter === 'combo' ? 'checked' : ''} style="width:auto;">
        Only show receipts with a Cake+Topper or Cake+Pastries combination
      </label>
    </div>
    <div class="card" id="historyCard"></div>
  `;
  main.appendChild(wrap);
  document.getElementById('goAdd2').addEventListener('click', () => { state.view = 'add'; render(); });
  document.getElementById('comboOnlyToggle').addEventListener('change', e => {
    state.historyFilter = e.target.checked ? 'combo' : 'all';
    render();
  });

  const card = wrap.querySelector('#historyCard');
  if (!state.receipts.length) {
    card.innerHTML = `<div class="empty"><h3>No receipts saved yet</h3><p>Add your first receipt to build history.</p></div>`;
    return;
  }

  const rowsData = state.receipts
    .map((r, idx) => ({ r, idx, c: computeCombosFromItems(r.items) }))
    .filter(({ c }) => state.historyFilter !== 'combo' || c.cakeTopper > 0 || c.cakePastries > 0);

  if (!rowsData.length) {
    card.innerHTML = `<div class="empty"><h3>No Cake+Topper or Cake+Pastries receipts yet</h3><p>${state.receipts.length} receipt(s) saved, but none currently qualify. Uncheck the filter above to see all of them.</p></div>`;
    return;
  }

  card.innerHTML = `
    <table>
      <thead><tr><th>Receipt</th><th>Date</th><th class="num">Total</th><th class="num">Cake+Topper</th><th class="num">Cake+Pastries</th><th></th></tr></thead>
      <tbody>
        ${rowsData.map(({ r, idx, c }) => {
          return `<tr>
            <td class="mono">#${r.number}</td>
            <td>${r.date || '\u2014'}</td>
            <td class="num">${peso(r.totalDue)}</td>
            <td class="num">${peso(c.cakeTopper)}</td>
            <td class="num">${peso(c.cakePastries)}</td>
            <td style="white-space:nowrap;">
              <button class="btn ghost small" data-act="view" data-idx="${idx}">View</button>
              <button class="btn ghost small" data-act="edit" data-idx="${idx}">Edit</button>
              <button class="btn ghost small danger" data-act="del" data-idx="${idx}">Delete</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div id="expandArea"></div>
  `;

  card.querySelectorAll('[data-act=view]').forEach(btn => btn.addEventListener('click', e => {
    const idx = Number(e.target.dataset.idx);
    toggleExpand(card, idx);
  }));
  card.querySelectorAll('[data-act=edit]').forEach(btn => btn.addEventListener('click', e => {
    const idx = Number(e.target.dataset.idx);
    const r = state.receipts[idx];
    state.draft = { number: r.number, date: r.date, totalDue: r.totalDue, rawText: r.rawText, items: r.items.map(i => ({ ...i })), editingIndex: idx };
    state.view = 'add';
    render();
  }));
  card.querySelectorAll('[data-act=del]').forEach(btn => btn.addEventListener('click', e => {
    const idx = Number(e.target.dataset.idx);
    if (confirm('Delete receipt #' + state.receipts[idx].number + '? This cannot be undone.')) {
      state.receipts.splice(idx, 1);
      render();
    }
  }));
}

function toggleExpand(card, idx){
  const area = card.querySelector('#expandArea');
  const r = state.receipts[idx];
  if (area.dataset.open === String(idx)) { area.innerHTML = ''; area.dataset.open = ''; return; }
  area.dataset.open = String(idx);
  area.innerHTML = `
    <hr class="divider">
    <h4 style="margin-bottom:10px;">Items on receipt #${r.number}</h4>
    <table>
      <thead><tr><th>Product</th><th>Category</th><th class="num">Qty</th><th class="num">Unit Price</th><th class="num">Total</th></tr></thead>
      <tbody>
        ${r.items.map(it => {
          const cat = it.categoryId ? categoryById(it.categoryId) : null;
          return `<tr>
            <td>${it.rawName}</td>
            <td>${cat ? `<span class="tag ${roleTagClass(cat.role)}">${cat.name}</span>` : `<span class="tag unmatched">unassigned</span>`}</td>
            <td class="num">${it.qty}</td>
            <td class="num">${peso(it.unitPrice)}</td>
            <td class="num">${peso(it.total)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

/* Handle saving edits back in place */
const originalRenderReview = renderReview;
renderReview = function(container, draft){
  originalRenderReview(container, draft);
  const saveBtn = container.querySelector('#saveReceipt');
  if (draft.editingIndex !== undefined && saveBtn) {
    saveBtn.textContent = 'Save Changes';
    saveBtn.onclick = null;
    saveBtn.replaceWith(saveBtn.cloneNode(true));
    const freshBtn = container.querySelector('#saveReceipt');
    freshBtn.addEventListener('click', () => {
      state.receipts[draft.editingIndex] = {
        id: state.receipts[draft.editingIndex].id,
        number: draft.number,
        date: draft.date,
        totalDue: draft.totalDue,
        rawText: draft.rawText,
        items: draft.items.map(i => ({ ...i }))
      };
      state.draft = null;
      state.view = 'history';
      render();
    });
  }
};

/* =========================================================
   VIEW: PRODUCTS & CATEGORIES
   ========================================================= */
function renderProducts(main){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="view-head">
      <div>
        <h1>Products &amp; Categories</h1>
        <p>Set which products belong to which category. Mark a category's role (Cake / Topper / Pastries) to include it in the tracked combinations.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn secondary" id="addCatBtn">+ Add category</button>
        <button class="btn" id="addProdBtn">+ Add product</button>
      </div>
    </div>

    <div class="card">
      <label class="field" style="max-width:320px; margin-bottom:0;">
        <span>Search products</span>
        <input type="text" id="searchProd" placeholder="Search by name...">
      </label>
    </div>

    <div id="catList"></div>
  `;
  main.appendChild(wrap);

  const catList = wrap.querySelector('#catList');
  function draw(filter){
    catList.innerHTML = '';
    state.categories.forEach(cat => {
      const prods = state.products.filter(p => p.categoryId === cat.id && (!filter || p.name.toUpperCase().includes(filter.toUpperCase())));
      const block = document.createElement('div');
      block.className = 'card cat-block';
      block.innerHTML = `
        <div class="cat-block-head">
          <div style="display:flex; align-items:center; gap:10px;">
            <h4 style="margin:0;">${cat.name}</h4>
            ${cat.role ? `<span class="tag ${roleTagClass(cat.role)}">${roleLabel(cat.role)} role</span>` : `<span class="tag">no role</span>`}
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn ghost small" data-act="renameCat" data-id="${cat.id}">Rename</button>
            <button class="btn ghost small" data-act="roleCat" data-id="${cat.id}">Set role</button>
            <button class="btn ghost small danger" data-act="delCat" data-id="${cat.id}">Delete</button>
          </div>
        </div>
        ${prods.length ? `
          <table>
            <thead><tr><th>Product name</th><th></th></tr></thead>
            <tbody>
              ${prods.map(p => `<tr>
                <td>${p.name}</td>
                <td style="text-align:right; white-space:nowrap;">
                  <button class="btn ghost small" data-act="editProd" data-id="${p.id}">Edit</button>
                  <button class="btn ghost small danger" data-act="delProd" data-id="${p.id}">Delete</button>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        ` : `<p style="color:var(--ink-faint); font-size:13.5px; margin:8px 0 0;">No products in this category${filter ? ' matching search' : ''}.</p>`}
      `;
      catList.appendChild(block);
    });

    catList.querySelectorAll('[data-act=renameCat]').forEach(b => b.addEventListener('click', e => {
      const cat = categoryById(e.target.dataset.id);
      openModal({
        title: 'Rename category',
        fields: [{ key: 'name', label: 'Category name', value: cat.name }],
        onSave: (vals) => { cat.name = vals.name.trim() || cat.name; render(); }
      });
    }));
    catList.querySelectorAll('[data-act=roleCat]').forEach(b => b.addEventListener('click', e => {
      const cat = categoryById(e.target.dataset.id);
      openRoleModal(cat);
    }));
    catList.querySelectorAll('[data-act=delCat]').forEach(b => b.addEventListener('click', e => {
      const cat = categoryById(e.target.dataset.id);
      const count = state.products.filter(p => p.categoryId === cat.id).length;
      if (confirm(`Delete category "${cat.name}"? ${count} product(s) in it will become uncategorized.`)) {
        state.products.forEach(p => { if (p.categoryId === cat.id) p.categoryId = null; });
        state.categories = state.categories.filter(c => c.id !== cat.id);
        render();
      }
    }));
    catList.querySelectorAll('[data-act=editProd]').forEach(b => b.addEventListener('click', e => {
      const prod = productById(e.target.dataset.id);
      openProductModal(prod);
    }));
    catList.querySelectorAll('[data-act=delProd]').forEach(b => b.addEventListener('click', e => {
      const prod = productById(e.target.dataset.id);
      if (confirm(`Delete product "${prod.name}"?`)) {
        state.products = state.products.filter(p => p.id !== prod.id);
        render();
      }
    }));
  }
  draw('');

  wrap.querySelector('#searchProd').addEventListener('input', e => draw(e.target.value));
  wrap.querySelector('#addCatBtn').addEventListener('click', () => {
    openModal({
      title: 'Add category',
      fields: [{ key: 'name', label: 'Category name', value: '' }],
      onSave: (vals) => {
        if (!vals.name.trim()) return;
        state.categories.push({ id: uid('cat'), name: vals.name.trim(), role: null });
        render();
      }
    });
  });
  wrap.querySelector('#addProdBtn').addEventListener('click', () => openProductModal(null));
}

function openProductModal(prod){
  const isEdit = !!prod;
  const catOptions = state.categories.map(c => `<option value="${c.id}" ${prod && prod.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`).join('');
  openModalCustom({
    title: isEdit ? 'Edit product' : 'Add product',
    bodyHTML: `
      <label class="field"><span>Product name</span><input type="text" id="mProdName" value="${isEdit ? prod.name.replace(/"/g,'&quot;') : ''}"></label>
      <label class="field"><span>Category</span><select id="mProdCat"><option value="">\u2014 none \u2014</option>${catOptions}</select></label>
    `,
    onSave: () => {
      const name = document.getElementById('mProdName').value.trim();
      const catId = document.getElementById('mProdCat').value || null;
      if (!name) return;
      if (isEdit) { prod.name = name; prod.categoryId = catId; }
      else state.products.push({ id: uid('prod'), name, categoryId: catId });
      closeModal();
      render();
    }
  });
}

function openRoleModal(cat){
  openModalCustom({
    title: `Set role for "${cat.name}"`,
    bodyHTML: `
      <p style="color:var(--ink-soft); font-size:13.5px; margin-top:0;">The role decides which of the two tracked combinations this category feeds into.</p>
      <div class="pill-select" id="roleOptions">
        <button data-role="" class="${!cat.role ? 'active' : ''}">No role</button>
        <button data-role="cake" class="${cat.role === 'cake' ? 'active' : ''}">Cake</button>
        <button data-role="topper" class="${cat.role === 'topper' ? 'active' : ''}">Topper</button>
        <button data-role="pastries" class="${cat.role === 'pastries' ? 'active' : ''}">Pastries</button>
      </div>
    `,
    onSave: () => {
      const chosen = document.querySelector('#roleOptions button.active');
      cat.role = chosen ? (chosen.dataset.role || null) : cat.role;
      closeModal();
      render();
    }
  });
  document.getElementById('roleOptions').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#roleOptions button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });
}

/* Generic modal helpers */
function openModal({ title, fields, onSave }){
  const bodyHTML = fields.map(f => `<label class="field"><span>${f.label}</span><input type="text" id="fld-${f.key}" value="${(f.value||'').replace(/"/g,'&quot;')}"></label>`).join('');
  openModalCustom({
    title, bodyHTML,
    onSave: () => {
      const vals = {};
      fields.forEach(f => vals[f.key] = document.getElementById('fld-' + f.key).value);
      onSave(vals);
      closeModal();
    }
  });
}
function openModalCustom({ title, bodyHTML, onSave }){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <h3>${title}</h3>
        <div style="margin-top:14px;">${bodyHTML}</div>
        <div class="modal-actions">
          <button class="btn secondary" id="modalCancel">Cancel</button>
          <button class="btn" id="modalSave">Save</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') closeModal(); });
  document.getElementById('modalSave').addEventListener('click', onSave);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* =========================================================
   VIEW: EXPORT
   ========================================================= */
function renderExport(main){
  const totals = allCombosTotal();
  const qualifyingCount = state.receipts.filter(r => {
    const c = computeCombosFromItems(r.items);
    return c.cakeTopper > 0 || c.cakePastries > 0;
  }).length;
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="view-head">
      <div>
        <h1>Export</h1>
        <p>Download every line item from Cake+Topper / Cake+Pastries receipts, plus a running-totals summary, as an Excel workbook.</p>
      </div>
    </div>
    <div class="card">
      <div class="stat-row">
        <div class="stat-mini"><div class="label">Qualifying receipts</div><div class="value">${qualifyingCount} / ${state.receipts.length}</div></div>
        <div class="stat-mini"><div class="label">Cake + Topper</div><div class="value">${peso(totals.cakeTopper)}</div></div>
        <div class="stat-mini"><div class="label">Cake + Pastries</div><div class="value">${peso(totals.cakePastries)}</div></div>
      </div>
      <button class="btn" id="exportBtn" ${!qualifyingCount ? 'disabled' : ''}>Export to Excel (.xlsx)</button>
      ${!qualifyingCount ? '<p style="color:var(--ink-faint); font-size:13px; margin-top:10px;">No Cake+Topper or Cake+Pastries receipts yet &mdash; add or bulk import some first.</p>' : ''}
    </div>

    <div class="card">
      <h4>Backup &amp; restore this session</h4>
      <p style="color:var(--ink-soft); font-size:13.5px;">This app keeps everything in memory for the current tab only &mdash; refreshing the page clears it. Download a backup file any time, and load it back in later.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn secondary" id="backupBtn">Download backup (.json)</button>
        <label class="btn secondary" style="position:relative; overflow:hidden;">
          Load backup
          <input type="file" id="restoreInput" accept=".json" style="position:absolute; inset:0; opacity:0; cursor:pointer;">
        </label>
      </div>
    </div>
  `;
  main.appendChild(wrap);

  document.getElementById('exportBtn')?.addEventListener('click', exportToExcel);
  document.getElementById('backupBtn').addEventListener('click', downloadBackup);
  document.getElementById('restoreInput').addEventListener('change', handleRestore);
}

function exportToExcel(){
  const rows = [];
  state.receipts.forEach(r => {
    const c = computeCombosFromItems(r.items);
    if (!(c.cakeTopper > 0 || c.cakePastries > 0)) return; // export only qualifying receipts
    r.items.forEach(it => {
      const cat = it.categoryId ? categoryById(it.categoryId) : null;
      rows.push({
        'Receipt Number': r.number,
        'Receipt Date': r.date,
        'Product': it.rawName,
        'Category': cat ? cat.name : 'Unassigned',
        'Quantity': it.qty,
        'Unit Price': it.unitPrice,
        'Product Total': it.total,
        'Cake + Topper Total (receipt)': c.cakeTopper,
        'Cake + Pastries Total (receipt)': c.cakePastries
      });
    });
  });
  const totals = allCombosTotal();
  const summaryRows = [
    { Metric: 'Receipts Processed', Value: state.receipts.length },
    { Metric: 'Cake + Topper (running total)', Value: totals.cakeTopper },
    { Metric: 'Cake + Pastries (running total)', Value: totals.cakePastries },
    { Metric: 'Generated On', Value: new Date().toLocaleString('en-PH') }
  ];

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(rows);
  const ws2 = XLSX.utils.json_to_sheet(summaryRows);
  XLSX.utils.book_append_sheet(wb, ws1, 'Receipts');
  XLSX.utils.book_append_sheet(wb, ws2, 'Summary');

  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'receipt-sales-tracker.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function downloadBackup(){
  const data = JSON.stringify({ categories: state.categories, products: state.products, receipts: state.receipts }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'receipt-tracker-backup.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function handleRestore(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.categories) state.categories = data.categories;
      if (data.products) state.products = data.products;
      if (data.receipts) state.receipts = data.receipts;
      alert('Backup restored.');
      render();
    } catch (err) {
      alert('Could not read that file. Make sure it\'s a backup exported from this app.');
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   INIT
   ========================================================= */
render();
</script>
